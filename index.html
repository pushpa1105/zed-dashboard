<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>%APP_NAME%</title>
    <!--
      Runs before first paint: applies the persisted theme (no flash of the wrong
      theme) and dresses the loader in the last brand and colors seen on this
      device. Keep the keys in sync with core/theme/config.ts and core/brand.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var read = function (key) {
          try {
            return JSON.parse(localStorage.getItem(key) || 'null');
          } catch (e) {
            return null;
          }
        };
        var theme = (read('zed-dashboard:theme') || {}).state || {};
        var mode = theme.mode || 'system';
        var dark =
          mode === 'dark' ||
          (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        root.classList.toggle('dark', dark);
        root.dataset.theme = theme.preset || 'lavender';
        root.dataset.font = theme.font || 'geist';
        root.dataset.scale = theme.scale || 'md';
        if (theme.radius != null) root.style.setProperty('--radius', theme.radius + 'rem');
        if (theme.customPrimary) {
          root.style.setProperty('--primary', theme.customPrimary);
          root.style.setProperty('--ring', theme.customPrimary);
        }
        window.__splash = read('zed-dashboard:splash');
      })();
    </script>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1.25rem;
        background: var(--splash-bg, #f7f6fb);
        color: var(--splash-fg, #1f1d2b);
        font:
          600 15px/1.2 system-ui,
          sans-serif;
        transition: opacity 0.3s ease;
      }
      .dark #splash {
        background: var(--splash-bg, #15131c);
        color: var(--splash-fg, #f2f1f7);
      }
      #splash[data-hidden] {
        opacity: 0;
        pointer-events: none;
      }
      #splash img {
        width: 56px;
        height: 56px;
        animation: splash-breathe 1.6s ease-in-out infinite;
      }
      #splash .bar {
        position: relative;
        width: 120px;
        height: 3px;
        overflow: hidden;
        border-radius: 9999px;
        background: color-mix(in srgb, currentColor 12%, transparent);
      }
      #splash .bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: currentColor;
        opacity: 0.7;
        animation: splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes splash-breathe {
        50% {
          transform: scale(0.88);
          opacity: 0.75;
        }
      }
      @keyframes splash-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash * {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="splash" role="status" aria-label="Loading">
      <img src="/favicon.svg" alt="" />
      <span class="name">%APP_NAME%</span>
      <span class="bar"></span>
    </div>
    <script>
      (function () {
        var s = window.__splash;
        if (!s) return;
        var splash = document.getElementById('splash');
        if (s.bg) splash.style.setProperty('--splash-bg', s.bg);
        if (s.fg) splash.style.setProperty('--splash-fg', s.fg);
        if (s.mark) splash.querySelector('img').src = s.mark;
        if (s.name) splash.querySelector('.name').textContent = s.name;
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
